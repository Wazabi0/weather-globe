<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Weather Globe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03050b; --panel:rgba(12,18,32,.78); --panel-solid:#0c1220; --line:rgba(150,180,255,.14);
  --text:#e8eefc; --muted:#8e9bb8; --accent:#5cc8ff; --accent2:#ffd25c; --ok:#3ddc97; --warn:#ffb347; --err:#ff5c7a;
  --radius:14px; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-size:13px}
button,input,select{font:inherit;color:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap;transition:opacity .2s}
.glass{background:var(--panel);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 40px rgba(0,0,0,.45)}
/* top bar */
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px}
.brand b{font-size:14px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.livedot{width:9px;height:9px;border-radius:50%;background:var(--err);box-shadow:0 0 0 0 rgba(255,92,122,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,92,122,.6)}70%{box-shadow:0 0 0 9px rgba(255,92,122,0)}100%{box-shadow:0 0 0 0 rgba(255,92,122,0)}}
.search{position:relative;flex:0 1 320px;margin-left:auto}
.search input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);outline:none}
.search input:focus{border-color:var(--accent)}
#qres{position:absolute;top:44px;left:0;right:0;overflow:hidden;display:none}
#qres button{display:block;width:100%;text-align:left;padding:9px 14px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
#qres button:hover{background:rgba(92,200,255,.12)}
#qres small{color:var(--muted)}
.ibtn{height:40px;min-width:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn:hover{border-color:var(--accent)}
.ibtn.on{background:rgba(92,200,255,.18);border-color:var(--accent)}
/* panel */
#panel{position:fixed;top:66px;left:12px;bottom:76px;width:318px;display:flex;flex-direction:column;z-index:4;transition:transform .3s,opacity .3s}
#panel.hidden{transform:translateX(-340px);opacity:0;pointer-events:none}
#panelBody{overflow-y:auto;padding:6px 14px 14px;scrollbar-width:thin;scrollbar-color:rgba(150,180,255,.25) transparent}
.tabs{display:flex;gap:4px;padding:10px 12px 6px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:7px 4px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer;font-weight:500}
.tabs button.on{background:rgba(92,200,255,.16);color:var(--text)}
h4{margin:14px 0 6px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(150,180,255,.07)}
.item .nm{font-weight:500}
.item .sb{grid-column:1;color:var(--muted);font-size:11px;display:flex;align-items:center;gap:6px}
.ctl{display:flex;align-items:center;gap:8px;margin-top:6px}
.item .ctl{grid-column:1/-1;margin-top:4px}
.sdot{width:7px;height:7px;border-radius:50%;background:#55607a;flex:none}
.sdot.ok{background:var(--ok)}.sdot.loading{background:var(--warn);animation:blink 1s infinite}.sdot.error{background:var(--err)}
@keyframes blink{50%{opacity:.3}}
.sw{position:relative;width:36px;height:20px;flex:none;grid-row:1/3;grid-column:2}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:20px;background:#2a3348;cursor:pointer;transition:.2s}
.sw span:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;border-radius:50%;background:#cfd8ee;transition:.2s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span:before{transform:translateX(16px);background:#fff}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:#2a3348;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #fff}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #fff}
.ctl label{color:var(--muted);font-size:11px;min-width:58px}
.ctl output{font-size:11px;color:var(--muted);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;font-size:12px}
.seg button.on{background:rgba(92,200,255,.2);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font-size:11.5px;user-select:none;background:rgba(255,255,255,.03)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.off{opacity:.4}
.mini{padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font-size:11.5px}
.mini:hover{border-color:var(--accent)}
.list button{display:flex;width:100%;justify-content:space-between;gap:8px;text-align:left;padding:8px 10px;margin:4px 0;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer}
.list button:hover{border-color:var(--accent)}
.list small{color:var(--muted)}
.src{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:7px 0;border-bottom:1px solid rgba(150,180,255,.07)}
.src .sdot{margin-top:5px}
.src small{grid-column:2;color:var(--muted);font-size:11px;word-break:break-word}
.note{color:var(--muted);font-size:11.5px;line-height:1.5}
.note a{color:var(--accent)}
select{background:#141c2e;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
/* legend */
#legend{position:fixed;right:12px;bottom:76px;width:250px;display:flex;flex-direction:column;gap:8px;z-index:3;pointer-events:none}
#legend .lg{padding:10px 12px;pointer-events:auto}
.lg b{font-size:11.5px;font-weight:600}
.lg .bar{height:8px;border-radius:5px;margin:6px 0 3px}
.lg .ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.lg .keys{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;font-size:11px;color:var(--muted)}
.lg .keys i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* readout and time bar */
#readout{position:fixed;left:50%;transform:translateX(-50%);top:66px;padding:7px 12px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;z-index:3;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .2s}
#readout b{color:var(--text);font-weight:500}
#timebar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(640px,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:8px 12px;z-index:5}
#timebar input{flex:1}
#tlabel{min-width:150px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:center}
#tlabel b{color:var(--text);font-weight:600}
/* popup */
#popup{position:fixed;top:66px;right:12px;width:340px;max-height:calc(100% - 160px);overflow-y:auto;padding:14px 16px;z-index:6}
#popup[hidden]{display:none}
.pp-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pp-h h3{margin:0;font-size:16px}
.pp-h small{color:var(--muted)}
.x{border:0;background:rgba(255,255,255,.07);border-radius:8px;width:28px;height:28px;cursor:pointer;flex:none}
.pp-now{display:flex;align-items:center;gap:14px;margin:12px 0}
.pp-now .big{font-size:40px;font-weight:600;letter-spacing:-1px;line-height:1}
.pp-now .cond{color:var(--muted);line-height:1.5}
.pp-now .cond b{color:var(--text);font-weight:600}
.pp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pp-grid div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pp-grid small{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
.pp-grid span{font-weight:600}
.pp-sec{margin-top:12px}
.pp-sec h5{margin:0 0 6px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.alert{border-left:3px solid var(--err);padding:6px 10px;background:rgba(255,92,122,.08);border-radius:6px;margin:6px 0;font-size:12px}
/* markers */
.storm{display:flex;align-items:center;gap:6px;pointer-events:auto;cursor:pointer;font-size:11px;font-weight:600;text-shadow:0 1px 3px #000}
.storm svg{animation:spin 3s linear infinite;filter:drop-shadow(0 0 6px currentColor)}
@keyframes spin{to{transform:rotate(-360deg)}}
.storm span{background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px;color:#fff}
.hl{font-weight:700;font-size:15px;text-shadow:0 0 4px #000,0 0 8px #000;text-align:center;line-height:1}
.hl small{display:block;font-size:9.5px;font-weight:600;opacity:.9}
.hl.L{color:#ff6b6b}.hl.H{color:#6bb8ff}
.cell{color:#d6a6ff;filter:drop-shadow(0 0 4px #b46bff)}
.subsolar{width:16px;height:16px;border-radius:50%;background:radial-gradient(#fff6c8,#ffcf4a 45%,rgba(255,180,40,0) 70%)}
.pin{width:18px;height:18px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 3px rgba(92,200,255,.6),0 0 14px rgba(92,200,255,.9)}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:20;transition:opacity .8s}
#loader.done{opacity:0;pointer-events:none}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(92,200,255,.2);border-top-color:var(--accent);animation:spin2 1s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
#loadmsg{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);padding:9px 14px;opacity:0;transition:opacity .3s;z-index:8;pointer-events:none}
#toast.show{opacity:1}
kbd{font:inherit;font-size:10.5px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
@media (max-width:760px){
  #top{top:8px;left:8px;right:8px;flex-wrap:wrap}
  .brand small{display:none}
  .search{flex:1 1 100%;order:3}
  #panel{top:auto;left:8px;right:8px;bottom:66px;width:auto;height:55%}
  #panel.hidden{transform:translateY(110%)}
  #legend{display:none}
  #popup{left:8px;right:8px;width:auto;top:auto;bottom:66px;max-height:60%}
  #readout{top:auto;bottom:66px}
  #tlabel{min-width:100px;font-size:11px}
}
</style>
<script type="importmap">

</script>

<body>
<div id="loader"><div class="spin"></div><div id="loadmsg">Loading Earth…</div></div>
<canvas id="c"></canvas>
<div id="labels"></div>
<header id="top">
  <div class="brand glass"><div class="livedot" title="Live"></div><div><b>Live Weather Globe</b><small id="clock">—</small></div></div>
  <div class="search"><input id="q" placeholder="Search a city or place…" autocomplete="off"><div id="qres" class="glass"></div></div>
  <button class="ibtn" id="btnRotate" title="Auto-rotate (R)">⟲</button>
  <button class="ibtn" id="btnRefresh" title="Refresh all live data">↻</button>
  <button class="ibtn on" id="btnPanel" title="Show/hide layers (L)">☰ Layers</button>
</header>
<aside id="panel" class="glass">
  <div class="tabs"><button data-tab="layers" class="on">Layers</button><button data-tab="filters">Filters</button><button data-tab="events">Events</button><button data-tab="sources">Sources</button></div>
  <div id="panelBody"></div>
</aside>
<section id="legend"></section>
<div id="readout" class="glass"></div>
<div id="timebar" class="glass">
  <button class="ibtn" id="btnPlay" title="Animate day/night cycle" style="height:32px;min-width:32px">▶</button>
  <input type="range" id="tslider" min="-24" max="24" step="0.25" value="0" aria-label="Sun time offset">
  <div id="tlabel"><b>Live</b></div>
  <button class="ibtn" id="btnNow" style="height:32px">Now</button>
</div>
<div id="popup" class="glass" hidden></div>
<div id="toast" class="glass"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   Config
   ===================================================================== */
const CDN = 'https://cdn.jsdelivr.net/npm/';
const TEX = CDN + 'three-globe@2.31.0/example/img/';
const BORDERS_URL = CDN + 'world-atlas@2.0.2/countries-50m.json';
const GIBS = 'https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/';
const DEG = Math.PI / 180;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const R = { // shell radii (Earth = 1)
  sst: 1.0010, field: 1.0018, imerg: 1.0026, radar: 1.0032, alertFill: 1.0036, borders: 1.0009, graticule: 1.0012,
  isobars: 1.0045, alerts: 1.0048, clouds: 1.0085, tracks: 1.0095, wind: 1.0105, lightning: 1.012, points: 1.011, aurora: 1.018,
};

const DEFAULTS = {
  units: 'metric',
  layers: {
    clouds: true, radar: true, imerg: false, wind: true, isobars: false, lightning: true, stormcells: true,
    storms: true, alerts: true, aurora: true, sst: false, quakes: false, fires: false, volcanoes: false,
    terminator: true, nightLights: true, borders: true, graticule: false, atmosphere: true, stars: true, satbase: false,
  },
  field: 'none',
  opacity: { clouds: 0.95, radar: 0.85, imerg: 0.85, field: 0.55, sst: 0.75 },
  filters: {
    cloudSource: 'auto', cloudThreshold: 0.5, windMin: 0, windCount: 7000, windSpeed: 1, windTrail: 10,
    lightningWindow: 30, quakeMin: 4.5, quakePeriod: 'day', stormMin: 0,
    alertTypes: { tornado: true, tstorm: true, flood: true, tropical: true, winter: true, heat: true, fire: true, other: false },
  },
  autorotate: false,
};

/* =====================================================================
   Settings persistence
   ===================================================================== */
function deepMerge(a, b) {
  for (const k in b) {
    if (!(k in a)) continue;
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') deepMerge(a[k], b[k]);
    else if (typeof b[k] === typeof a[k]) a[k] = b[k];
  }
  return a;
}
const S = (() => { let s = null; try { s = JSON.parse(localStorage.getItem('wg-settings') || 'null'); } catch {} return deepMerge(structuredClone(DEFAULTS), s || {}); })();
let saveT; function saveSettings() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem('wg-settings', JSON.stringify(S)); } catch {} }, 300); }

/* =====================================================================
   Helpers
   ===================================================================== */
function ll2v(lat, lon, r = 1, out = new THREE.Vector3()) {
  const la = lat * DEG, lo = lon * DEG, c = Math.cos(la);
  return out.set(r * c * Math.cos(lo), r * Math.sin(la), -r * c * Math.sin(lo));
}
function v2ll(v) { const r = v.length(); return { lat: Math.asin(clamp(v.y / r, -1, 1)) / DEG, lon: Math.atan2(-v.z, v.x) / DEG }; }
function wrapLon(l) { return ((l + 540) % 360) - 180; }
function gcDist(a1, o1, a2, o2) { // km
  const p1 = a1 * DEG, p2 = a2 * DEG, dp = p2 - p1, dl = (o2 - o1) * DEG;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(Math.min(1, h)));
}
async function fetchJSON(url, opts = {}, ms = 25000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url, { ...opts, signal: c.signal });
    if (!r.ok) throw new Error(r.status === 429 ? 'rate limited (HTTP 429)' : 'HTTP ' + r.status);
    return await r.json();
  } catch (e) { if (e.name === 'AbortError') throw new Error('timed out'); if (e instanceof TypeError) throw new Error('network/CORS blocked'); throw e; }
  finally { clearTimeout(t); }
}
function loadImage(url, ms = 30000) {
  return new Promise((res, rej) => {
    const im = new Image(); im.crossOrigin = 'anonymous'; im.decoding = 'async';
    const t = setTimeout(() => { im.src = ''; rej(new Error('timed out')); }, ms);
    im.onload = () => { clearTimeout(t); res(im); };
    im.onerror = () => { clearTimeout(t); rej(new Error('image failed')); };
    im.src = url;
  });
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function ramp(stops) {
  const s = stops.map(([v, h]) => [v, ...hex(h)]);
  return v => {
    if (!(v > s[0][0])) return [s[0][1], s[0][2], s[0][3]];
    for (let i = 1; i < s.length; i++) if (v <= s[i][0]) {
      const a = s[i - 1], b = s[i], t = (v - a[0]) / (b[0] - a[0]);
      return [a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t];
    }
    const l = s[s.length - 1]; return [l[1], l[2], l[3]];
  };
}
function cssGradient(stops) { const lo = stops[0][0], hi = stops.at(-1)[0]; return 'linear-gradient(90deg,' + stops.map(([v, h]) => `${h} ${((v - lo) / (hi - lo) * 100).toFixed(1)}%`).join(',') + ')'; }
const fmtTime = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function ago(d) { const s = (Date.now() - d) / 1000; if (s < 90) return 'just now'; if (s < 5400) return Math.round(s / 60) + ' min ago'; if (s < 172800) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' d ago'; }
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }

/* units */
const U = {
  temp: c => S.units === 'metric' ? `${Math.round(c)}°C` : `${Math.round(c * 9 / 5 + 32)}°F`,
  tempN: c => S.units === 'metric' ? Math.round(c) + '°' : Math.round(c * 9 / 5 + 32) + '°',
  wind: ms => S.units === 'metric' ? `${Math.round(ms * 3.6)} km/h` : `${Math.round(ms * 2.237)} mph`,
  pres: h => S.units === 'metric' ? `${Math.round(h)} hPa` : `${(h * 0.02953).toFixed(2)} inHg`,
  mm: v => S.units === 'metric' ? `${v.toFixed(1)} mm` : `${(v / 25.4).toFixed(2)} in`,
};
const COMPASS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
const compass = d => COMPASS[Math.round(((d % 360) + 360) % 360 / 22.5) % 16];
const WMO = { 0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Rime fog', 51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle', 56: 'Freezing drizzle', 57: 'Freezing drizzle', 61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain', 67: 'Freezing rain', 71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 77: 'Snow grains', 80: 'Rain showers', 81: 'Rain showers', 82: 'Violent showers', 85: 'Snow showers', 86: 'Heavy snow showers', 95: 'Thunderstorm', 96: 'Thunderstorm, hail', 99: 'Severe thunderstorm, hail' };

/* =====================================================================
   Source status
   ===================================================================== */
const SOURCES = {

function subsolar(date) {
  const d = date.getTime() / 86400000 - 10957.5; // days since J2000.0
  const g = (357.529 + 0.98560028 * d) * DEG;
  const q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * DEG;
  const e = (23.439 - 0.00000036 * d) * DEG;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)) / DEG;
  const dec = Math.asin(Math.sin(e) * Math.sin(L)) / DEG;
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  return { lat: dec, lon: wrapLon(ra - gmst * 15) };

let fly = null;
function flyTo(lat, lon, dist = null, dur = 1600) {
  const from = camera.position.clone().normalize(), to = ll2v(lat, lon, 1), d0 = camera.position.length();

}

  const q = new THREE.Quaternion().slerp(fly.q, e);
  const d = fly.d0 + (fly.d1 - fly.d0) * e + Math.sin(Math.PI * e) * fly.ang * 0.35;
  camera.position.copy(fly.from).applyQuaternion(q).multiplyScalar(d);
  camera.lookAt(0, 0, 0);
  if (t >= 1) fly = null;
}

      ${slider('f-lwin', 'Show last', 1, 120, 1, F.lightningWindow, v => v + ' min')}
      <h4>Tropical cyclones</h4>
      <div class="ctl"><label>Minimum</label><select id="f-stormmin">${CAT.map(c => `<option value="${c[0]}" ${F.stormMin == c[0] ? 'selected' : ''}>${c[1]}${c[0] ? ' (' + c[0] + '+ kt)' : ' and up'}</option>`).join('')}</select></div>
      <h4>Severe weather alerts</h4>
      <div class="chips" id="alertChips">${Object.entries(ALERT_CATS).map(([k, [l, c]]) => `<span class="chip ${F.alertTypes[k] ? '' : 'off'}" data-acat="${k}"><i style="background:${c}"></i>${l} <small>${alerts.filter(a => a.cat === k).length}</small></span>`).join('')}</div>
      <h4>Earthquakes</h4>
      ${slider('f-qmin', 'Min mag.', 2.5, 7, 0.1, F.quakeMin, v => 'M' + (+v).toFixed(1))}
      <div class="ctl"><label>Period</label><div class="seg"><button data-qper="day" class="${F.quakePeriod === 'day' ? 'on' : ''}">24 hours</button><button data-qper="week" class="${F.quakePeriod === 'week' ? 'on' : ''}">7 days</button></div></div>
      <div style="margin-top:16px"><button class="mini" id="resetAll">Reset all settings</button></div>`;
  } else if (currentTab === 'events') {
    const nowS = (Date.now() - T0) / 1000; let lmin = 0; const cut = Date.now() - 60e3; L.recent = L.recent.filter(t => t > cut); lmin = L.recent.length;
    const st2 = storms.filter(s => (s.kts || 0) >= S.filters.stormMin).sort((a, b) => (b.kts || 0) - (a.kts || 0));
    const big = quakeData.filter(q => q.mag >= Math.max(5, S.filters.quakeMin)).sort((a, b) => b.mag - a.mag).slice(0, 8);
    const al = Object.entries(ALERT_CATS).map(([k, [l, c]]) => [l, c, alerts.filter(a => a.cat === k).length]).filter(a => a[2]);
    const hot = lightningHotspots();
    body.innerHTML = `<h4>Lightning</h4><div class="note">${L.connected ? `<b style="color:var(--accent2)">${lmin}</b> strikes in the last minute worldwide · ${Math.min(L.count, LMAX).toLocaleString()} received this session` : status.lightning?.msg || 'Not connected'}</div>
      ${hot.length ? `<div class="list">${hot.map(h => `<button data-fly="${h.lat},${h.lon}"><span>Hotspot ${h.lat.toFixed(0)}°, ${h.lon.toFixed(0)}°</span><small>${h.n} strikes / 15 min</small></button>`).join('')}</div>` : ''}
      ${grid ? `<div class="note" style="margin-top:6px">${grid.cells || 0} model grid points report thunderstorms right now.</div>` : ''}
      <h4>Tropical cyclones</h4>${st2.length ? `<div class="list">${st2.map((s, i) => `<button data-storm="${storms.indexOf(s)}"><span>${s.title}</span><small style="color:${catOf(s.kts)[2]}">${catOf(s.kts)[1]}${s.kts ? ' · ' + Math.round(s.kts) + ' kt' : ''}</small></button>`).join('')}</div>` : `<div class="note">${status.storms?.state === 'ok' ? 'No active tropical systems.' : status.storms?.msg || 'Loading…'}</div>`}
      <h4>US alerts</h4>${al.length ? `<div class="chips">${al.map(([l, c, n]) => `<span class="chip"><i style="background:${c}"></i>${l} ${n}</span>`).join('')}</div>` : `<div class="note">${status.alerts?.msg || 'Loading…'}</div>`}
      <h4>Significant earthquakes</h4>${big.length ? `<div class="list">${big.map(q => `<button data-fly="${q.lat},${q.lon}"><span>M${q.mag.toFixed(1)} ${q.place || ''}</span><small>${ago(q.t)}</small></button>`).join('')}</div>` : '<div class="note">None M5+ in the selected period (turn on the Earthquakes layer to load).</div>'}
      <h4>Jump to</h4><div class="seg">${[['N. America', 40, -100], ['S. America', -15, -60], ['Europe', 50, 12], ['Africa', 5, 20], ['Asia', 30, 100], ['Oceania', -25, 140], ['Arctic', 80, 0], ['Antarctica', -80, 0]].map(([n, a, o]) => `<button data-fly="${a},${o},2.6">${n}</button>`).join('')}</div>`;
  } else {
    body.innerHTML = `<h4>Data sources</h4>${Object.entries(SOURCES).map(([k, [n, d]]) => `<div class="src">${sdot(k)}<div><b>${n}</b></div><small>${status[k]?.msg ? status[k].msg + ' · ' : ''}${d}${status[k]?.t ? ' · checked ' + fmtTime(status[k].t) : ''}</small></div>`).join('')}
      <p class="note" style="margin-top:14px">Everything here is free public data fetched straight from your browser. Wind, temperature, pressure, humidity and CAPE come from a global model grid (Open-Meteo, ~1000 km spacing, refreshed every 30 min); clouds, radar and lightning are observations. Lightning data © Blitzortung.org contributors, for non-commercial use.</p>`;
  }
  body.scrollTop = st; renderStatus2();
}
function renderStatus2() { document.querySelectorAll('[data-sdot]').forEach(el => { el.className = 'sdot ' + (status[el.dataset.sdot]?.state || ''); el.title = status[el.dataset.sdot]?.msg || ''; }); }
function lightningHotspots() {
  const nowS = (Date.now() - T0) / 1000, bins = new Map();
  for (let i = 0; i < Math.min(L.count, LMAX); i++) {
    if (nowS - L.birth[i] > 900) continue;
    const k = Math.floor(L.lat[i] / 5) * 1000 + Math.floor(L.lon[i] / 5);
    const b = bins.get(k) || { n: 0, la: 0, lo: 0 }; b.n++; b.la += L.lat[i]; b.lo += L.lon[i]; bins.set(k, b);
  }
  return [...bins.values()].sort((a, b) => b.n - a.n).slice(0, 5).filter(b => b.n > 3).map(b => ({ n: b.n, lat: b.la / b.n, lon: b.lo / b.n }));
}

const panelBody = $('#panelBody');
panelBody.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.layer) { setLayer(t.dataset.layer, t.checked); return; }
  if (t.id === 'f-cloudsrc') { S.filters.cloudSource = t.value; saveSettings(); loadClouds(); }
  if (t.id === 'f-stormmin') { S.filters.stormMin = +t.value; saveSettings(); drawStorms(); }
  if (t.id === 'f-windcount' || t.id === 'f-windtrail') resetWind();
  if (t.id === 'f-cloudth') { if (cloudSrc || grid) { toast('Re-processing clouds…', 1200); setTimeout(buildClouds, 30); } }
  if (t.id === 'f-qmin') drawQuakes();
  if (t.id === 'f-windmin') resetWind();
});
panelBody.addEventListener('input', e => {
  const t = e.target; if (t.type !== 'range') return;
  const v = +t.value, out = t.parentElement.querySelector('output');
  if (t.id.startsWith('op-')) { const k = t.id.slice(3); S.opacity[k] = v; applyOpacity(); out.textContent = Math.round(v * 100) + '%'; }
  const F = S.filters;
  if (t.id === 'f-cloudth') { F.cloudThreshold = v; out.textContent = v.toFixed(2); }
  if (t.id === 'f-windmin') { F.windMin = v; out.textContent = U.wind(v); }
  if (t.id === 'f-windcount') { F.windCount = v; out.textContent = (v / 1000).toFixed(1) + 'k'; }
  if (t.id === 'f-windspeed') { F.windSpeed = v; out.textContent = v.toFixed(2) + '×'; }
  if (t.id === 'f-windtrail') { F.windTrail = v; out.textContent = v; }
  if (t.id === 'f-lwin') { F.lightningWindow = v; lMat.uniforms.win.value = v * 60; out.textContent = v + ' min'; }
  if (t.id === 'f-qmin') { F.quakeMin = v; out.textContent = 'M' + v.toFixed(1); }
  saveSettings();
});
panelBody.addEventListener('click', e => {
  const t = e.target.closest('button,[data-acat]'); if (!t) return;
  if (t.dataset.field) { S.field = t.dataset.field; saveSettings(); buildField(); renderPanel(); updateLegend(); }
  if (t.dataset.units) { S.units = t.dataset.units; saveSettings(); renderPanel(); updateLegend(); }
  if (t.id === 'radarAnim') toggleRadarAnim();
  if (t.dataset.acat) { const k = t.dataset.acat; S.filters.alertTypes[k] = !S.filters.alertTypes[k]; saveSettings(); drawAlerts(); renderPanel(); }
  if (t.dataset.qper) { S.filters.quakePeriod = t.dataset.qper; saveSettings(); renderPanel(); safe(loadQuakes, 'quakes'); }
  if (t.dataset.fly) { const [a, o, d] = t.dataset.fly.split(',').map(Number); flyTo(a, o, d || 1.9); }
  if (t.dataset.storm) { const s = storms[+t.dataset.storm]; flyTo(s.lat, s.lon, 2.0); showStorm(s); }
  if (t.id === 'resetAll') { try { localStorage.removeItem('wg-settings'); } catch {} location.reload(); }
});

/* =====================================================================
   Layer switching
   ===================================================================== */
const lazy = { radar: () => loadRadar(), imerg: () => loadIMERG(), sst: () => loadSST(), aurora: () => loadAurora(), storms: () => loadStorms(), alerts: () => loadAlerts(), quakes: () => loadQuakes(), fires: () => loadEonet(), volcanoes: () => loadEonet(), borders: () => loadBorders(), clouds: () => loadClouds() };
const loaded = new Set();
const srcKey = { fires: 'eonet', volcanoes: 'eonet' };
async function safe(fn, key) { try { await fn(); } catch (e) { setStatus(key, 'error', e.message); console.warn(key, e); } }
function ensure(key) {
  const k = srcKey[key] || key;
  if (!lazy[key] || loaded.has(k)) return;
  loaded.add(k); safe(lazy[key], k);
}
function setLayer(key, on) {
  S.layers[key] = on; saveSettings();
  if (on) ensure(key);
  if (key === 'lightning') { on ? (L.fails = 0, connectLightning()) : (disconnectLightning(), setStatus('lightning', '', 'off')); }
  if (key === 'satbase') applyBase();
  applyVisibility(); renderPanel(); updateLegend();
}
function applyVisibility() {
  const Ly = S.layers;
  clouds.visible = Ly.clouds; earthMat.uniforms.cloudShadow.value = Ly.clouds ? S.opacity.clouds : 0;
  shells.radar.visible = Ly.radar; shells.imerg.visible = Ly.imerg; shells.sst.visible = Ly.sst;
  shells.alertFill.visible = Ly.alerts && alerts.length > 0; if (alertLines) alertLines.visible = Ly.alerts;
  shells.field.visible = S.field !== 'none' && !!grid;
  if (wind) wind.mesh.visible = Ly.wind;
  lightning.visible = Ly.lightning;
  if (isobarLines) isobarLines.visible = Ly.isobars;
  if (stormLines) stormLines.visible = Ly.storms;
  aurora.visible = Ly.aurora;
  pts.quakes.visible = Ly.quakes; pts.fires.visible = Ly.fires; pts.volcanoes.visible = Ly.volcanoes;
  if (borders) borders.visible = Ly.borders; graticule.visible = Ly.graticule;
  atmo.visible = Ly.atmosphere; stars.visible = Ly.stars; sunSprite.visible = Ly.stars;
  earthMat.uniforms.nightLights.value = Ly.nightLights ? 1 : 0; earthMat.uniforms.showTerm.value = Ly.terminator ? 1 : 0;
  controls.autoRotate = S.autorotate; $('#btnRotate').classList.toggle('on', S.autorotate);
}
function applyOpacity() {
  cloudMat.uniforms.opacity.value = S.opacity.clouds; earthMat.uniforms.cloudShadow.value = S.layers.clouds ? S.opacity.clouds : 0;
  for (const k of ['radar', 'imerg', 'sst', 'field']) shells[k].material.uniforms.opacity.value = S.opacity[k];
  saveSettings();
}

/* =====================================================================
   Legend
   ===================================================================== */
function legendBar(title, stops, fmt, extra = '') {
  const lo = stops[0][0], hi = stops.at(-1)[0], mid = stops[Math.floor(stops.length / 2)][0];
  return `<div class="lg glass"><b>${title}</b><div class="bar" style="background:${cssGradient(stops.map(([v, h]) => [v, h.slice(0, 7)]))}"></div><div class="ticks"><span>${fmt(lo)}</span><span>${fmt(mid)}</span><span>${fmt(hi)}</span></div>${extra}</div>`;
}
function fieldFmt(f) {
  if (f.unit === '°C') return v => U.tempN(v);
  if (f.unit === 'm/s') return v => U.wind(v).replace(' ', '');
  if (f.unit === 'hPa') return v => S.units === 'metric' ? v : (v * 0.02953).toFixed(1);
  return v => v + (f.unit === '%' ? '%' : '');
}
function updateLegend() {
  const out = [];
  const f = FIELDS[S.field]; if (f) out.push(legendBar(f.label + (f.unit === '°C' || f.unit === 'm/s' || f.unit === 'hPa' ? '' : ` (${f.unit})`), f.stops, fieldFmt(f)));
  if (S.layers.wind && grid) out.push(legendBar('Wind particles', [[0, '#9fd8ff'], [8, '#f4ffd0'], [17, '#ffad4a'], [33, '#ff3fd0']], v => U.wind(v).replace(' ', '')));
  if (S.layers.lightning) out.push(`<div class="lg glass"><b>Lightning age</b><div class="bar" style="background:linear-gradient(90deg,#fff,#ffe04d 25%,#f24d26)"></div><div class="ticks"><span>now</span><span>${Math.round(S.filters.lightningWindow / 2)} min</span><span>${S.filters.lightningWindow} min</span></div></div>`);
  if (S.layers.radar && radar.time) out.push(`<div class="lg glass"><b>Radar ${radar.anim ? '(loop) ' : ''}${fmtTime(radar.time)}</b><div class="bar" style="background:linear-gradient(90deg,#88ddee,#0099cc,#0077aa,#ffee00,#ffaa00,#ff4400,#c10000,#ff00ff)"></div><div class="ticks"><span>light</span><span>moderate</span><span>extreme</span></div></div>`);
  if (S.layers.storms && storms.length) out.push(`<div class="lg glass"><b>Cyclone category</b><div class="keys">${CAT.map(c => `<span><i style="background:${c[2]}"></i>${c[1]}</span>`).join('')}</div></div>`);
  if (S.layers.alerts && alerts.length) out.push(`<div class="lg glass"><b>US alerts</b><div class="keys">${Object.entries(ALERT_CATS).filter(([k]) => S.filters.alertTypes[k]).map(([, [l, c]]) => `<span><i style="background:${c}"></i>${l}</span>`).join('')}</div></div>`);
  if (S.layers.quakes) out.push(`<div class="lg glass"><b>Earthquake depth</b><div class="keys"><span><i style="background:#ffd23f"></i>&lt;70 km</span><span><i style="background:#ff8a3d"></i>70–300</span><span><i style="background:#e0445a"></i>&gt;300 km</span></div></div>`);
  $('#legend').innerHTML = out.slice(0, 5).join('');
}

/* =====================================================================
   Top bar & time controls
   ===================================================================== */
$('#btnPanel').onclick = () => { const p = $('#panel'); p.classList.toggle('hidden'); $('#btnPanel').classList.toggle('on', !p.classList.contains('hidden')); };
$('#btnRotate').onclick = () => { S.autorotate = !S.autorotate; saveSettings(); applyVisibility(); };
$('#btnRefresh').onclick = () => { toast('Refreshing live data…'); refreshAll(true); };
const tslider = $('#tslider');
tslider.oninput = () => { sunOffsetH = +tslider.value; };
$('#btnNow').onclick = () => { sunOffsetH = 0; tslider.value = 0; playing = false; $('#btnPlay').textContent = '▶'; };
$('#btnPlay').onclick = () => { playing = !playing; $('#btnPlay').textContent = playing ? '❚❚' : '▶'; };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'r' || e.key === 'R') $('#btnRotate').click();
  if (e.key === 'l' || e.key === 'L') $('#btnPanel').click();
  if (e.key === ' ') { e.preventDefault(); $('#btnPlay').click(); }
  if (e.key === 'Escape') { popup.hidden = true; removeLabels('pin'); }
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
if (innerWidth < 760) { $('#panel').classList.add('hidden'); $('#btnPanel').classList.remove('on'); }

const subsolarLbl = (() => { const el = document.createElement('div'); el.className = 'subsolar'; el.title = 'Subsolar point (sun directly overhead)'; return addLabel(el, 0, 0, 'sun', 1.004); })();

/* =====================================================================
   Refresh cycle
   ===================================================================== */
async function refreshAll(force = false) {
  gridPromise = loadGrid(force).catch(e => { setStatus('grid', 'error', e.message); throw e; });
  gridPromise.catch(() => {});
  if (S.layers.clouds) safe(loadClouds, 'clouds');
  for (const k of ['radar', 'imerg', 'sst', 'aurora', 'storms', 'alerts', 'quakes', 'fires', 'volcanoes']) {
    if (!S.layers[k]) { if (force) loaded.delete(srcKey[k] || k); continue; }
    if (force || !loaded.has(srcKey[k] || k)) { loaded.add(srcKey[k] || k); safe(lazy[k], srcKey[k] || k); }
  }
  if (force) { radar.frames.forEach(f => f.tex.dispose()); radar.frames = []; if (radar.anim) stopRadarAnim(); }
}
setInterval(() => refreshAll(true), 10 * 60e3);

/* =====================================================================
   Main loop
   ===================================================================== */
const clock = $('#clock'); let lastT = performance.now(), lastClock = 0, lastEvents = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (playing) { sunOffsetH += dt * 1.5; if (sunOffsetH > 24) sunOffsetH = -24; tslider.value = sunOffsetH; }
  const date = simDate(), ss = subsolar(date);
  ll2v(ss.lat, ss.lon, 1, sunDir); sunSprite.position.copy(sunDir).multiplyScalar(1100);
  subsolarLbl.pos.copy(ll2v(ss.lat, ss.lon, 1.004));
  if (now - lastClock > 500) {
    lastClock = now;
    const utc = new Date().toISOString().slice(11, 19);
    clock.textContent = `${utc} UTC · ${L.connected ? L.recent.filter(t => t > Date.now() - 60e3).length + ' strikes/min' : 'lightning offline'}`;
    $('#tlabel').innerHTML = sunOffsetH === 0 ? '<b>Live</b> · sun now' : `<b>${date.toISOString().slice(5, 16).replace('T', ' ')} UTC</b> · ${sunOffsetH > 0 ? '+' : ''}${sunOffsetH.toFixed(1)} h`;
    if (L.recent.length > 20000) L.recent = L.recent.filter(t => t > Date.now() - 60e3);
  }
  if (currentTab === 'events' && now - lastEvents > 5000) { lastEvents = now; renderPanel(); }
  const d = camera.position.length();
  controls.rotateSpeed = clamp((d - 1) * 0.45, 0.02, 1); controls.zoomSpeed = clamp((d - 1) * 0.6, 0.15, 1);
  camera.near = clamp((d - 1) * 0.3, 0.0008, 0.1); camera.updateProjectionMatrix();
  stepFly(now); if (!fly) controls.update();
  stepWind(dt);
  const tS = (Date.now() - T0) / 1000;
  flushStrikes(); lMat.uniforms.now.value = tS; lMat.uniforms.win.value = S.filters.lightningWindow * 60;
  auroraMat.uniforms.time.value = tS; for (const p of Object.values(pts)) p.material.uniforms.time.value = tS;
  renderer.render(scene, camera);
  updateLabels();
}

/* =====================================================================
   Boot
   ===================================================================== */
(async () => {
  renderPanel(); applyVisibility(); applyOpacity(); updateLegend();
  requestAnimationFrame(frame);
  try { await loadEarth(); }
  catch (e) { setStatus('textures', 'error', e.message); $('#loadmsg').textContent = 'Could not load Earth imagery (' + e.message + '). Check your connection.'; }
  $('#loader').classList.add('done');
  if (S.layers.satbase) applyBase();
  if (S.layers.borders) ensure('borders');
  refreshAll(false);
  for (const k of ['radar', 'imerg', 'sst', 'aurora', 'storms', 'alerts', 'quakes', 'fires', 'volcanoes', 'clouds']) if (S.layers[k]) loaded.add(srcKey[k] || k);
  if (S.layers.lightning) connectLightning();
  gridPromise.then(() => { updateLegend(); renderPanel(); }).catch(() => {});
})();
window.__wg = { S, status, L, addStrike, get grid() { return grid; } };
</script>
</body>
</html>
