# Collects regional headlines every 15 minutes for the globe's breaking news ticker
# and publishes them as news.json on the news-data branch (see scripts/build-news.mjs).
name: Breaking news feed

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build-news.mjs', '.github/workflows/news.yml']

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Collect headlines
        run: node scripts/build-news.mjs out/news.json

      - name: Publish to the news-data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git checkout -q -b news-data
          git add news.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Headlines $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news-data
