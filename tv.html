<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live TV · Live Weather Globe</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
// Plays one YouTube live channel or video. The globe's pop-out window (Document Picture-in-Picture) has no web address
// of its own, so YouTube would not know which site embeds its player and refuses to play; this page gives it one.
// tv.html?channel=<YouTube channel id> or tv.html?v=<video id>, plus &mute=0 for sound.
const q = new URLSearchParams(location.search), ch = q.get('channel') || '', v = q.get('v') || '';
if (/^UC[\w-]{22}$/.test(ch) || /^[\w-]{11}$/.test(v)) {
  const f = document.createElement('iframe');
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true; f.title = 'Live TV';
  f.src = `https://www.youtube.com/embed/${v ? v + '?' : 'live_stream?channel=' + ch + '&'}autoplay=1&mute=${q.get('mute') === '0' ? 0 : 1}&playsinline=1&rel=0`;
  document.body.append(f);
}
</script>
</body>
</html>
